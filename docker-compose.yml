name: streamwatch-ai
services:
  redpanda:
    image: redpandadata/redpanda:v24.3.10
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --overprovisioned
      - --check=false
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
    ports: ["127.0.0.1:19092:19092"]
    volumes: [redpanda_data:/var/lib/redpanda/data]
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: streamwatch
      POSTGRES_PASSWORD: local_dev_only
      POSTGRES_DB: streamwatch
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U streamwatch -d streamwatch"]
      interval: 5s
      retries: 20
    volumes: [postgres_data:/var/lib/postgresql/data]
  api:
    build: .
    command: uvicorn backend.app.main:app --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: postgresql+psycopg://streamwatch:local_dev_only@postgres:5432/streamwatch
      API_TOKEN: \${API_TOKEN:-}
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
  consumer:
    build: .
    command: python -m consumer.run
    environment:
      DATABASE_URL: postgresql+psycopg://streamwatch:local_dev_only@postgres:5432/streamwatch
      KAFKA_BOOTSTRAP: redpanda:9092
      KAFKA_TOPIC: telemetry.events.v1
      KAFKA_DLQ_TOPIC: telemetry.invalid.v1
      WORKER_METRICS_PORT: 9100
    depends_on:
      postgres: {condition: service_healthy}
      redpanda: {condition: service_started}
  producer:
    build: .
    command: python -m producer.run
    environment:
      KAFKA_BOOTSTRAP: redpanda:9092
      KAFKA_TOPIC: telemetry.events.v1
      EVENTS_PER_SECOND: \${EVENTS_PER_SECOND:-5}
      SIMULATED_ANOMALY_RATE: \${SIMULATED_ANOMALY_RATE:-0.08}
    depends_on:
      redpanda: {condition: service_started}
  frontend:
    build: ./frontend
    ports: ["127.0.0.1:8080:80"]
    depends_on:
      api: {condition: service_started}
  prometheus:
    image: prom/prometheus:v2.55.1
    volumes: ["./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["127.0.0.1:9090:9090"]
    depends_on: [consumer]
volumes:
  redpanda_data:
  postgres_data:
