ound"/><line x1="0" y1="595" x2="1200" y2="595" stroke="#315c70" stroke-width="1" stroke-linecap="round"/><line x1="0" y1="625" x2="1200" y2="625" stroke="#315c70" stroke-width="1" stroke-linecap="round"/><line x1="0" y1="655" x2="1200" y2="655" stroke="#315c70" stroke-width="1" stroke-linecap="round"/></g><text x="55" y="63" fill="#6beacb" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="800" text-anchor="start">STREAMWATCH / AI</text><text x="55" y="112" fill="#f3fcff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="39" font-weight="750" text-anchor="start">Latency instrumentation points</text><text x="55" y="146" fill="#a6c4d4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="500" text-anchor="start">Measurement boundaries, not a universal end-to-end latency guarantee</text><rect x="65" y="228" width="302" height="146" rx="22" fill="#132b42" stroke="#30546a" stroke-width="2"/><text x="85" y="266" fill="#69e9c7" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" text-anchor="start">T0</text><text x="85" y="312" fill="#eaf8ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" text-anchor="start">Event clock</text><text x="85" y="344" fill="#9bb6ca" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="500" text-anchor="start">Producer timestamp</text><rect x="445" y="228" width="302" height="146" rx="22" fill="#132b42" stroke="#30546a" stroke-width="2"/><text x="465" y="266" fill="#83afff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" text-anchor="start">T1</text><text x="465" y="312" fill="#eaf8ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" text-anchor="start">Scoring runtime</text><text x="465" y="344" fill="#9bb6ca" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="500" text-anchor="start">process event</text><rect x="823" y="228" width="302" height="146" rx="22" fill="#132b42" stroke="#30546a" stroke-width="2"/><text x="843" y="266" fill="#f8be84" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" text-anchor="start">T2</text><text x="843" y="312" fill="#eaf8ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" text-anchor="start">Storage write</text><text x="843" y="344" fill="#9bb6ca" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="500" text-anchor="start">SQL commit</text><line x1="372" y1="303" x2="436" y2="303" stroke="#58dbbf" stroke-width="3" stroke-linecap="round"/><polygon points="436,303 422,295 422,311" fill="#58dbbf"/><line x1="753" y1="303" x2="814" y2="303" stroke="#58dbbf" stroke-width="3" stroke-linecap="round"/><polygon points="814,303 800,295 800,311" fill="#58dbbf"/><rect x="140" y="431" width="931" height="94" rx="15" fill="#173b4a" stroke="#377287" stroke-width="2"/><text x="173" y="467" fill="#f2fafb" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" text-anchor="start">End-to-end = T2 - T0</text><text x="173" y="498" fill="#a7c6d6" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="500" text-anchor="start">Clock skew and queueing can affect this metric; processing_ms is measured separately.</text><line x1="55" y1="607" x2="1145" y2="607" stroke="#345569" stroke-width="1" stroke-linecap="round"/><text x="55" y="636" fill="#7c9fb4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" text-anchor="start">REAL-TIME STREAMING &amp; ANOMALY DETECTION</text><text x="1145" y="636" fill="#79e4d1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" text-anchor="end">DESIGN / SYNTHETIC</text></svg>