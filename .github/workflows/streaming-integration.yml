name: docker-streaming-integration
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: streamwatch-docker-main
  cancel-in-progress: true
jobs:
  kafka-stack-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      API_TOKEN: github-ci-smoke-only-not-production
      EVENTS_PER_SECOND: '15'
      SIMULATED_ANOMALY_RATE: '0.25'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: docker compose config -q
      - run: docker compose up --build -d
      - name: Validate Kafka worker SQL API DLQ and investigation audit
        run: python -m scripts.smoke
      - name: Start optional Grafana overlay
        run: docker compose -f docker-compose.yml -f docker-compose.observability.yml up -d grafana
      - name: Verify Prometheus rules and provisioned Grafana dashboard
        run: python -m scripts.observability_smoke
      - name: Publish diagnostic logs
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.observability.yml ps && docker compose -f docker-compose.yml -f docker-compose.observability.yml logs --no-color --tail=140
      - name: Stop test services
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.observability.yml down -v --remove-orphans
